name: Linux build and release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - name: debian
            image: debian:bookworm
          - name: arch
            image: archlinux:latest
          - name: opensuse
            image: opensuse/leap:15.6

    container:
      image: ${{ matrix.distro.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -e
          case "${{ matrix.distro.name }}" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build qt6-base-dev libgl1-mesa-dev ca-certificates git curl
              ;;
            arch)
              pacman -Syu --noconfirm --needed base-devel cmake ninja qt6-base polkit ca-certificates git curl
              ;;
            opensuse)
              zypper --non-interactive ref
              zypper --non-interactive install -t pattern devel_C_C++ \
                cmake ninja qt6-base-devel ca-certificates git curl
              ;;
          esac

      - name: Configure build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build rufus-qt
        run: |
          cmake --build build

      - name: Create release package
        run: |
          mkdir -p release
          cp build/src/rufus-qt release/rufus-qt
          tar czf release/rufus-qt-${{ matrix.distro.name }}-${{ github.ref_name }}.tar.gz -C release rufus-qt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rufus-qt-${{ matrix.distro.name }}
          path: release/rufus-qt-${{ matrix.distro.name }}-${{ github.ref_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Compiled rufus-qt binaries for Debian, Arch Linux, and openSUSE.

            Each package contains the native `rufus-qt` executable ready to use.
          files: release-artifacts/*.tar.gz
