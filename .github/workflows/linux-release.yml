name: Linux build and release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - name: debian
            image: debian:bookworm
          - name: arch
            image: archlinux:latest
          - name: opensuse
            image: opensuse/leap:15.6

    container:
      image: ${{ matrix.distro.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          set -e
          case "${{ matrix.distro.name }}" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential autoconf automake libtool pkg-config libgtk-3-dev libssl-dev ca-certificates git curl
              ;;
            arch)
              pacman -Syu --noconfirm --needed base-devel autoconf automake libtool pkgconf gtk3 openssl ca-certificates git curl
              ;;
            opensuse)
              zypper --non-interactive ref
              zypper --non-interactive install -t pattern devel_C_C++ \
                autoconf automake libtool pkg-config libopenssl-devel gtk3-devel ca-certificates git curl
              ;;
          esac

      - name: Configure build
        run: |
          ./configure --disable-debug

      - name: Build Rufus Linux
        run: |
          make -j$(nproc)

      - name: Create release package
        run: |
          mkdir -p release
          cp src/rufus-linux release/rufus-linux
          tar czf release/rufus-linux-${{ matrix.distro.name }}-${{ github.ref_name }}.tar.gz -C release rufus-linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rufus-linux-${{ matrix.distro.name }}
          path: release/rufus-linux-${{ matrix.distro.name }}-${{ github.ref_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Compiled Rufus Linux binaries for Debian, Arch Linux y openSUSE.
            
            Cada paquete contiene el ejecutable nativo `rufus-linux` listo para usar.
          files: release-artifacts/*.tar.gz
